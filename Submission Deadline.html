<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>InaSH Submission Deadline</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            /* Disable drop shadows and text shadows globally */
            box-shadow: none !important;
            text-shadow: none !important;
            filter: none !important;
        }

        body {
            background-color: #ffffff; /* Pure white background */
            color: #111111;            /* Crisp dark text */
            font-family: 'Segoe UI', system-ui, -apple-system, BlinkMacSystemFont, Roboto, sans-serif;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 24px;
            -webkit-font-smoothing: antialiased;
        }

        .countdown-container {
            background-color: #ffffff;
            border: 1px solid #e5e5e5; /* Soft Windows light mode border */
            border-radius: 8px;
            padding: 48px 36px;
            width: 100%;
            max-width: 820px;
            text-align: center;
        }

        .title {
            font-size: 1.75rem;
            font-weight: 600;
            letter-spacing: -0.02em;
            color: #111111;
            margin-bottom: 36px;
        }

        /* Timer Grid Layout */
        .timer-grid {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 12px;
        }

        @media (max-width: 640px) {
            .timer-grid {
                grid-template-columns: repeat(3, 1fr);
            }
        }

        .box {
            background-color: #f8f9fa; /* Light clean grey card background */
            border-radius: 6px;
            padding: 22px 10px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            border: 1px solid #e2e4e8;  /* Crisp light grey border */
        }

        .number {
            font-size: 2.75rem;
            font-weight: 700;
            line-height: 1;
            color: #000000;
            font-variant-numeric: tabular-nums;
            margin-bottom: 8px;
        }

        .label {
            font-size: 0.725rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            color: #666666; /* Subdued dark grey label text */
        }

        /* Expired State */
        .expired-msg {
            display: none;
            font-size: 1.75rem;
            font-weight: 600;
            color: #111111;
            padding: 20px 0;
        }
    </style>
</head>
<body>

    <div class="countdown-container">
        <!-- Title -->
        <h1 class="title">InaSH Submission Deadline</h1>

        <!-- Timer Grid starting with Weeks -->
        <div id="timer" class="timer-grid">
            <div class="box">
                <div id="weeks" class="number">00</div>
                <div class="label">Weeks</div>
            </div>
            <div class="box">
                <div id="days" class="number">00</div>
                <div class="label">Days</div>
            </div>
            <div class="box">
                <div id="hours" class="number">00</div>
                <div class="label">Hours</div>
            </div>
            <div class="box">
                <div id="minutes" class="number">00</div>
                <div class="label">Minutes</div>
            </div>
            <div class="box">
                <div id="seconds" class="number">00</div>
                <div class="label">Seconds</div>
            </div>
        </div>

        <!-- Expired message display -->
        <div id="expired-msg" class="expired-msg">
            Submission Closed
        </div>
    </div>

    <script>
        // Target Date: December 5, 2026 00:00:00
        const targetDate = new Date('December 5, 2026 00:00:00').getTime();

        const weeksEl = document.getElementById('weeks');
        const daysEl = document.getElementById('days');
        const hoursEl = document.getElementById('hours');
        const minutesEl = document.getElementById('minutes');
        const secondsEl = document.getElementById('seconds');
        const timerGrid = document.getElementById('timer');
        const expiredMsg = document.getElementById('expired-msg');

        function padZero(num) {
            return String(num).padStart(2, '0');
        }

        function updateCountdown() {
            const now = new Date().getTime();
            const diff = targetDate - now;

            if (diff <= 0) {
                clearInterval(interval);
                timerGrid.style.display = 'none';
                expiredMsg.style.display = 'block';
                return;
            }

            const msPerSecond = 1000;
            const msPerMinute = msPerSecond * 60;
            const msPerHour = msPerMinute * 60;
            const msPerDay = msPerHour * 24;
            const msPerWeek = msPerDay * 7;

            const weeks = Math.floor(diff / msPerWeek);
            const days = Math.floor((diff % msPerWeek) / msPerDay);
            const hours = Math.floor((diff % msPerDay) / msPerHour);
            const minutes = Math.floor((diff % msPerHour) / msPerMinute);
            const seconds = Math.floor((diff % msPerMinute) / msPerSecond);

            weeksEl.textContent = padZero(weeks);
            daysEl.textContent = padZero(days);
            hoursEl.textContent = padZero(hours);
            minutesEl.textContent = padZero(minutes);
            secondsEl.textContent = padZero(seconds);
        }

        updateCountdown();
        const interval = setInterval(updateCountdown, 1000);
    </script>
</body>
</html>
